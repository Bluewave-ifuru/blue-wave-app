<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>TripAdvisor Reviews</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;

      font-family: Arial, sans-serif;
    }


    .page {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      flex-direction: column;

      background: #ffffff;

      padding:
        calc(8px + env(safe-area-inset-top))
        10px
        calc(8px + env(safe-area-inset-bottom));
    }


    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
      flex: 0 0 auto;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;

      padding-bottom: 8px;
    }


    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 38px;

      padding: 9px 13px;

      border-radius: 9px;

      text-decoration: none;

      font-size: 13px;
      font-weight: bold;

      white-space: nowrap;
    }


    .back-button {
      background: #eaf2f8;
      color: #12385b;
    }


    .tripadvisor-button {
      background: #12385b;
      color: #ffffff;
    }


    /* =========================
       POSTER
    ========================= */

    .poster-area {
      flex: 1 1 0;

      min-height: 0;

      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    .poster {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


  </style>

</head>


<body>


  <div class="page">


    <!-- TOP LEFT + TOP RIGHT BUTTONS -->

    <div class="top-bar">


      <a
        class="button back-button"
        href="./index.html"
      >
        ← Operations Hub
      </a>


      <a
        class="button tripadvisor-button"

        href="https://www.tripadvisor.com/Attraction_Review-g26636997-d32910485-Reviews-Blue_Wave_Ifuru_By_Dive_Butler_At_Ifuru_Island_Maldives-Ifuru.html"

        target="_blank"

        rel="noopener noreferrer"
      >
        OPEN TRIPADVISOR
      </a>


    </div>



    <!-- TRIPADVISOR POSTER -->

    <div class="poster-area">


      <img
        class="poster"

        src="./tripadvisor-poster.png"

        alt="Blue Wave Ifuru TripAdvisor Review QR Code"
      >


    </div>


  </div>


</body>

</html>
