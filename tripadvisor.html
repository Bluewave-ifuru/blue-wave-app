<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>TripAdvisor Reviews</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 650px;
      height: 100vh;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        calc(10px + env(safe-area-inset-bottom));

      background: #ffffff;
    }

    /* BACK BUTTON */

    .top {
      flex: 0 0 auto;
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
    }

    .back-button {
      display: inline-block;

      padding: 9px 16px;

      background: #eaf2f8;
      color: #12385b;

      border-radius: 9px;

      text-decoration: none;

      font-size: 14px;
      font-weight: bold;
    }

    /* POSTER */

    .poster-container {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .poster {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
    }

    /* TRIPADVISOR BUTTON */

    .bottom {
      flex: 0 0 auto;

      width: 100%;

      text-align: center;

      padding-top: 10px;
    }

    .tripadvisor-button {
      display: inline-block;

      padding: 12px 24px;

      background: #12385b;
      color: #ffffff;

      border-radius: 9px;

      text-decoration: none;

      font-size: 14px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="page">


    <div class="top">

      <a
        class="back-button"
        href="./index.html"
      >
        ← Operations Hub
      </a>

    </div>


    <div class="poster-container">

      <img
        class="poster"
        src="./tripadvisor-poster.png"
        alt="Blue Wave Ifuru TripAdvisor Review QR Code"
      >

    </div>


    <div class="bottom">

      <a
        class="tripadvisor-button"
        href="https://www.tripadvisor.com/Attraction_Review-g26636997-d32910485-Reviews-Blue_Wave_Ifuru_By_Dive_Butler_At_Ifuru_Island_Maldives-Ifuru.html"
        target="_blank"
        rel="noopener noreferrer"
      >
        OPEN TRIPADVISOR
      </a>

    </div>


  </div>

</body>

</html>
