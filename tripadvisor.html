<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>TripAdvisor Reviews</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;

      font-family: Arial, sans-serif;
    }


    body {
      height: 100vh;
      height: 100dvh;
    }


    .page {
      width: 100%;
      height: 100%;

      display: grid;

      /*
        Top controls
        Poster gets remaining space
        Bottom controls
      */

      grid-template-rows:
        55px
        minmax(0, 1fr)
        60px;

      padding:
        env(safe-area-inset-top)
        10px
        env(safe-area-inset-bottom);

      overflow: hidden;
    }


    /* TOP */

    .top {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
    }


    .back-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 9px 16px;

      background: #eaf2f8;
      color: #12385b;

      border-radius: 9px;

      text-decoration: none;

      font-size: 14px;
      font-weight: bold;
    }


    /* POSTER */

    .poster-container {
      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    .poster {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* BOTTOM */

    .bottom {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
    }


    .tripadvisor-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 11px 22px;

      background: #12385b;
      color: #ffffff;

      border-radius: 9px;

      text-decoration: none;

      font-size: 14px;
      font-weight: bold;

      white-space: nowrap;
    }

  </style>

</head>


<body>


  <div class="page">


    <!-- TOP -->

    <div class="top">

      <a
        class="back-button"
        href="./index.html"
      >
        ← Operations Hub
      </a>

    </div>



    <!-- POSTER -->

    <div class="poster-container">

      <img
        class="poster"
        src="./tripadvisor-poster.png"
        alt="Blue Wave Ifuru TripAdvisor Review QR Code"
      >

    </div>



    <!-- BOTTOM -->

    <div class="bottom">

      <a
        class="tripadvisor-button"

        href="https://www.tripadvisor.com/Attraction_Review-g26636997-d32910485-Reviews-Blue_Wave_Ifuru_By_Dive_Butler_At_Ifuru_Island_Maldives-Ifuru.html"

        target="_blank"

        rel="noopener noreferrer"
      >
        OPEN TRIPADVISOR
      </a>

    </div>


  </div>


</body>

</html>
