<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Booking Confirmation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fa;
      font-family: Arial, sans-serif;
      color: #17324d;
    }

    .header {
      background: #ffffff;
      padding: 18px 16px;
      border-bottom: 1px solid #dde5ec;
    }

    .header-inner {
      max-width: 760px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      padding: 8px 13px;

      background: #eaf2f8;
      color: #12385b;

      border-radius: 8px;
      text-decoration: none;

      font-size: 14px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      color: #12385b;
    }

    .subtitle {
      margin-top: 5px;
      color: #6c7d8d;
      font-size: 14px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 18px 14px 40px;
    }

    .section {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #12385b;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #425466;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;

      padding: 10px 11px;

      border: 1px solid #cfd9e2;
      border-radius: 8px;

      background: #ffffff;
      color: #172b3a;

      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #12385b;
    }

    .pax-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .price-box {
      margin-top: 16px;

      padding: 14px;

      background: #f3f7fa;
      border-radius: 9px;

      text-align: center;
    }

    .price-label {
      font-size: 12px;
      color: #6c7d8d;
      margin-bottom: 4px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #12385b;
    }

    .generate {
      width: 100%;

      padding: 14px;

      border: none;
      border-radius: 10px;

      background: #12385b;
      color: #ffffff;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .pax-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }

      h1 {
        font-size: 22px;
      }

    }

  </style>

</head>


<body>


  <div class="header">

    <div class="header-inner">

      <a
        class="back"
        href="./index.html"
      >
        ← Operations Hub
      </a>

      <h1>
        Booking Confirmation
      </h1>

      <div class="subtitle">
        Create a guest booking confirmation card
      </div>

    </div>

  </div>



  <main class="container">


    <div class="section">

      <div class="section-title">
        Booking Details
      </div>


      <div class="grid">


        <div class="field">

          <label for="room">
            Room No.
          </label>

          <input
            id="room"
            type="text"
            placeholder="e.g. 409"
          >

        </div>



        <div class="field">

          <label for="activity">
            Activity
          </label>

<select id="activity" onchange="calculateTotal()">

  <option value="">
    Select Activity
  </option>

  <option value="Sunrise Fishing">Sunrise Fishing</option>

  <option value="Sunset Fishing">Sunset Fishing</option>

  <option value="Desert Island Exploration on Kokomo">
    Desert Island Exploration on Kokomo
  </option>

  <option value="Sandbank Snorkeling on Kokomo">
    Sandbank Snorkeling on Kokomo
  </option>

  <option value="Luxury Sunset Cruise on Kokomo">
    Luxury Sunset Cruise on Kokomo
  </option>

  <option value="Deep Sea Fishing on Kokomo">
    Deep Sea Fishing on Kokomo
  </option>

  <option value="Turtle Snorkeling">
    Turtle Snorkeling
  </option>

  <option value="House Reef Snorkeling">
    House Reef Snorkeling
  </option>

  <option value="Wildlife Snorkeling">
    Wildlife Snorkeling
  </option>

  <option value="Castaway Snorkeling">
    Castaway Snorkeling
  </option>

  <option value="Local Island Experience">
    Local Island Experience
  </option>

  <option value="Night Snorkeling">
    Night Snorkeling
  </option>

  <option value="Sunset Cruise">
    Sunset Cruise
  </option>

  <option value="Dolphin Cruise">
    Dolphin Cruise
  </option>

  <option value="Manta Quest">
    Manta Quest
  </option>

</select>
        </div>



        <div class="field full">

          <label>
            Number of Guests
          </label>


          <div class="pax-grid">


            <div>

              <label for="adults">
                Adults
              </label>

              <input
                id="adults"
                type="number"
                min="0"
                value="0"
                oninput="calculateTotal()"
              >

            </div>


            <div>

              <label for="kids">
                Kids 6–12
              </label>

              <input
                id="kids"
                type="number"
                min="0"
                value="0"
                 oninput="calculateTotal()"
              >

            </div>


            <div>

              <label for="infants">
                Kids 0–5
              </label>

              <input
                id="infants"
                type="number"
                min="0"
                value="0"
                 oninput="calculateTotal()"
              >

            </div>


          </div>

        </div>



        <div class="field">

          <label for="date">
            Activity Date
          </label>

          <input
            id="date"
            type="date"
          >

        </div>



        <div class="field">

          <label for="reportingTime">
            Reporting Time
          </label>

          <input
            id="reportingTime"
            type="time"
          >

        </div>



        <div class="field">

          <label for="gro">
            GRO / Butler
          </label>

        <select id="gro">

  <option value="">
    Select GRO / Butler
  </option>

  <option>Direct Booking</option>
  <option>Choatey</option>
  <option>Jeehan</option>
  <option>Suaid</option>
  <option>Monica</option>
  <option>Anastassia</option>
  <option>Damira</option>
  <option>Suci</option>
  <option>Naz</option>

</select>

        </div>



        <div class="field">

          <label for="bookedBy">
            Booked By
          </label>

          <select id="bookedBy">

            <option value="">
              Select Staff
            </option>

            <option>Silvio</option>
            <option>Sahil</option>
            <option>Yoosuf</option>
            <option>Ahmed</option>
            <option>Fayaz</option>
            <option>Muaz</option>

          </select>

        </div>



        <div class="field full">

          <label for="status">
            Booking Status
          </label>

          <select id="status">

            <option value="CONFIRMED">
              Confirmed
            </option>

            <option value="TBC">
              To Be Confirmed
            </option>

            <option value="CANCELLED">
              Cancelled
            </option>

          </select>

        </div>


      </div>


      <div class="price-box">

        <div class="price-label">
          Booking Total
        </div>

        <div
          class="price"
          id="bookingTotal"
        >
          —
        </div>

      </div>


    </div>



    <button
      class="generate"
      type="button"
      onclick="generateCard()"
    >
      GENERATE CONFIRMATION CARD
    </button>


  </main>



  <script>

  const activityPrices = {
    "Sunrise Fishing": 70,
    "Sunset Fishing": 70,
    "Desert Island Exploration on Kokomo": 150,
    "Sandbank Snorkeling on Kokomo": 150,
    "Luxury Sunset Cruise on Kokomo": 120,
    "Deep Sea Fishing on Kokomo": 150,
    "Turtle Snorkeling": 95,
    "House Reef Snorkeling": 50,
    "Wildlife Snorkeling": 95,
    "Castaway Snorkeling": 95,
    "Local Island Experience": 85,
    "Night Snorkeling": 70,
    "Sunset Cruise": 95,
    "Dolphin Cruise": 95,
    "Manta Quest": 120
  };


  function calculateTotal() {

    const activity =
      document.getElementById("activity").value;

    const adults =
      Number(document.getElementById("adults").value) || 0;

    const kids =
      Number(document.getElementById("kids").value) || 0;


    const priceDisplay =
      document.getElementById("bookingTotal");


    if (!activity || activityPrices[activity] === undefined) {

      priceDisplay.textContent = "—";

      return;
    }


    const basePrice =
      activityPrices[activity];


    const chargeablePax =
      adults + (kids * 0.5);


    if (chargeablePax === 0) {

      priceDisplay.textContent = "$0.00";

      return;
    }


    const total =
      basePrice *
      chargeablePax *
      1.10 *
      1.17;


    priceDisplay.textContent =
      "$" + total.toFixed(2);

  }


  document
    .getElementById("activity")
    .addEventListener("change", calculateTotal);


  document
    .getElementById("adults")
    .addEventListener("input", calculateTotal);


  document
    .getElementById("kids")
    .addEventListener("input", calculateTotal);


  document
    .getElementById("infants")
    .addEventListener("input", calculateTotal);



  function generateCard() {

    alert(
      "Booking card generator will be connected in the next step."
    );

  }

</script>
</body>

</html>
