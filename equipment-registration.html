<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

:root {

* { box-sizing: border-box; }

body { margin: 0; }

main {

.top {

  padding: 18px;
}

.logo {
  width: 100px;
  max-width: 30%;
}

h1 {
  font-size: 26px;
  margin: 10px 0 5px;
}

h2 {

}

.muted {

}

.card {

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {

  font-weight: 600;
  margin: 12px 0 6px;
}

input[type=text],
input[type=number],
input[type=date] {
  width: 100%;
  padding: 12px;
  border: 1px solid #c5d4dd;
  border-radius: 9px;
  font: inherit;
}

.agreement {
  padding: 14px;
  background: #f5f9fc;
  border: 1px solid #dce8ee;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.6;
  max-height: 300px;
  overflow: auto;
}

.agreement p {
  margin: 0 0 10px;
}

.notice {
  background: #fff5e6;
  border-left: 4px solid #e7a435;
  padding: 12px;
  border-radius: 6px;
  font-size: 14px;
}

.signature {
  border: 1px solid #b6cbd8;
  border-radius: 10px;
  width: 100%;
  height: 150px;
  display: block;
  touch-action: none;
  background: white;
}

.signrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0;
}

.button {
  background: #086a9c;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 13px 18px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

.button.secondary {
  background: #e6f2f8;
  color: #07547a;
}

.button.light {
  background: #f3f5f6;
  color: #415b6b;
}

.button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.participant {
  border: 1px solid #d6e3eb;
  border-radius: 12px;
  padding: 15px;
  margin: 15px 0;
}

.participant-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 15px 0;
}

.check input {
  margin-top: 4px;
  transform: scale(1.2);
}

.check label {
  margin: 0;
  font-weight: normal;
}

.hidden {
  display: none !important;
}

.foot {
  text-align: center;
  font-size: 12px;
  color: #637989;
  margin: 22px 0;
}

.status {
  padding: 12px;
  border-radius: 8px;
  background: #e6f4ed;
  color: #17563b;
  margin-top: 15px;
  line-height: 1.6;
}
