<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Wave Equipment Management</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fb;
      color: #17233c;
    }

    .header {
      background: #12385b;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .85;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .back-button {
      display: inline-block;
      background: #e8f0f7;
      color: #12385b;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5df;
      border-radius: 9px;
      font-size: 16px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      border: none;
      border-radius: 10px;
      padding: 14px 6px;
      background: white;
      color: #12385b;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .tab.active {
      background: #12385b;
      color: white;
    }

    .count {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .date-group {
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .date-heading {
      width: 100%;
      border: none;
      background: #e8f0f7;
      color: #12385b;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-heading .arrow {
      transition: transform .25s ease;
    }

    .date-group.open .arrow {
      transform: rotate(90deg);
    }

    .date-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .25s ease;
    }

    .date-group.open .date-content {
      grid-template-rows: 1fr;
    }

    .date-content-inner {
      overflow: hidden;
      min-height: 0;
    }

    .villa-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 15px;
    }

    .villa-box {
      min-height: 72px;
      border: 1px solid #cbd5df;
      border-radius: 10px;
      background: white;
      color: #12385b;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      padding: 8px 4px;
    }

    .villa-box:active {
      background: #e8f0f7;
    }

    .status {
      text-align: center;
      padding: 18px;
      color: #607080;
      font-weight: bold;
    }

    .error { color: #b42318; }

    .empty {
      text-align: center;
      padding: 30px;
      color: #778390;
    }

    @media (max-width: 600px) {
      .villa-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .villa-box {
        min-height: 65px;
        font-size: 17px;
      }

      .tab {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>BLUE WAVE DIVE CENTER</h1>
    <p>Equipment Management</p>
  </header>

  <main class="container">

    <a href="./index.html" class="back-button">
      ← Operations Hub
    </a>

    <div class="card">
      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search villa number"
        oninput="renderRegistrations()"
      >
    </div>

    <div class="tabs">

      <button class="tab active" id="tab-REGISTERED"
        onclick="changeTab('REGISTERED')">
        <span class="count" id="count-REGISTERED">0</span>
        Pending
      </button>

      <button class="tab" id="tab-ISSUED"
        onclick="changeTab('ISSUED')">
        <span class="count" id="count-ISSUED">0</span>
        Issued
      </button>

      <button class="tab" id="tab-COMPLETED"
        onclick="changeTab('COMPLETED')">
        <span class="count" id="count-COMPLETED">0</span>
        Completed
      </button>

    </div>

    <div id="status" class="status">
      Loading registrations...
    </div>

    <div id="registrationList"></div>

  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzg-QR_87Lpk_IChM8AQADfGGLN3dAXhMlxrkcq7to0RVFJaD1oB5oYnDKTuBbXD5Et-Q/exec";

    let registrations = [];
    let currentTab = "REGISTERED";

    // Remember manually opened/closed dates.
    const expandedDates = {};

    async function apiCall(action, payload = {}) {
      const response = await fetch(API_URL, {
        method: "POST",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({ action, ...payload })
      });

      const result = await response.json();

      if (!result.ok) {
        throw new Error(result.error || "Backend request failed.");
      }

      return result.data;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseDate(dateString) {
      const parts = String(dateString).split("-");
      if (parts.length !== 3) return null;

      const date = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );

      return isNaN(date.getTime()) ? null : date;
    }

    function displayDate(dateString) {
      const date = parseDate(dateString);
      if (!date) return dateString;

      return date.toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function autoExpand(dateString) {
      const date = parseDate(dateString);
      if (!date) return false;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const lastExpandedDay = new Date(today);
      lastExpandedDay.setDate(today.getDate() + 3);

      // Past dates remain expanded so overdue returns are visible.
      return date <= lastExpandedDay;
    }

    async function loadRegistrations() {
      const status = document.getElementById("status");

      status.style.display = "block";
      status.textContent = "Loading registrations...";
      status.className = "status";

      try {
        registrations = await apiCall("rentalListRegistrations");

        if (!Array.isArray(registrations)) {
          throw new Error("Invalid registration data.");
        }

        status.style.display = "none";

        updateCounts();
        renderRegistrations();

      } catch (error) {
        status.className = "status error";
        status.textContent = "Error: " + error.message;
      }
    }

    function updateCounts() {
      ["REGISTERED", "ISSUED", "COMPLETED"].forEach(status => {
        const count = registrations.filter(
          item => item.status === status
        ).length;

        document.getElementById("count-" + status).textContent = count;
      });
    }

    function changeTab(status) {
      currentTab = status;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      document.getElementById("tab-" + status).classList.add("active");

      renderRegistrations();
    }

    function toggleDate(dateKey) {
      const group = document.getElementById("date-" + dateKey);
      if (!group) return;

      const isOpen = group.classList.toggle("open");

      expandedDates[currentTab + "|" + dateKey] = isOpen;

      group.querySelector(".date-heading")
        .setAttribute("aria-expanded", String(isOpen));
    }

    function renderRegistrations() {
      const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

      const list = document.getElementById("registrationList");

      const filtered = registrations.filter(item => {
        return (
          item.status === currentTab &&
          String(item.villa || "").toLowerCase().includes(search)
        );
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="empty">No registrations found.</div>';
        return;
      }

      const grouped = {};

      filtered.forEach(item => {
        const date = String(item.departure || "Unknown");

        if (!grouped[date]) grouped[date] = [];

        grouped[date].push(item);
      });

      const dates = Object.keys(grouped).sort();

      list.innerHTML = dates.map(dateKey => {
        const savedState = expandedDates[currentTab + "|" + dateKey];

        // When searching, show matching villas immediately.
        const open = search
          ? true
          : savedState !== undefined
            ? savedState
            : autoExpand(dateKey);

        const villas = grouped[dateKey].map(item => `
          <button
            class="villa-box"
            type="button"
            data-rental-id="${escapeHtml(item.rentalId)}"
          >
            ${escapeHtml(item.villa)}
          </button>
        `).join("");

        return `
          <section
            class="date-group ${open ? "open" : ""}"
            id="date-${escapeHtml(dateKey)}"
          >
            <button
              class="date-heading"
              type="button"
              data-date="${escapeHtml(dateKey)}"
              aria-expanded="${open}"
            >
              <span>
                ${escapeHtml(displayDate(dateKey))}
                (${grouped[dateKey].length})
              </span>
              <span class="arrow">▶</span>
            </button>

            <div class="date-content">
              <div class="date-content-inner">
                <div class="villa-grid">
                  ${villas}
                </div>
              </div>
            </div>
          </section>
        `;
      }).join("");
    }

    document.getElementById("registrationList")
      .addEventListener("click", function(event) {
        const dateButton = event.target.closest("[data-date]");
        if (dateButton) {
          toggleDate(dateButton.dataset.date);
          return;
        }

        const villaButton = event.target.closest("[data-rental-id]");
        if (villaButton) {
          openRegistration(villaButton.dataset.rentalId);
        }
      });

    function openRegistration(rentalId) {
      const registration = registrations.find(
        item => item.rentalId === rentalId
      );

      if (!registration) {
        alert("Registration not found.");
        return;
      }

      alert(
        "Villa " + registration.villa +
        "\n\nEquipment issuing and returns will be added next."
      );
    }

    window.onload = loadRegistrations;
  </script>

</body>
</html>
